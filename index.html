<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beatriz & Gustavo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* CARD INICIAL */
    .card {
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 25px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: fadeUp 1.2s ease;
      position: relative;
      z-index: 2;
    }

    .fade-out { animation: fadeOut 1s forwards; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut { to { opacity: 0; transform: scale(0.95); } }

    h1 { margin-bottom: 5px; font-size: 26px; }
    .subtitle { font-size: 13px; opacity: 0.9; margin-bottom: 20px; }

    /* TIMER */
    .timer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .time-box {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 8px;
    }
    .number { font-size: 18px; font-weight: bold; }
    .label { font-size: 10px; opacity: 0.8; }

    /* GALERIA */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
    }
    .gallery img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: transform .15s ease;
    }
    .gallery img:hover { transform: scale(1.03); }

    /* TIMELINE */
    .timeline{
      margin-top: 18px;
      text-align:left;
      background: rgba(0,0,0,0.22);
      padding: 12px;
      border-radius: 14px;
    }
    .tl-item{
      display:flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      font-size: 12px;
    }
    .tl-item:last-child{ border-bottom:none; }
    .tl-item span{ opacity:.9; }

    /* BOTÕES */
    button {
      margin-top: 16px;
      background: #ff4d6d;
      border: none;
      padding: 12px 22px;
      border-radius: 30px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .15s ease;
    }
    button:hover { transform: scale(1.05); }

    /* BOTÃO MÚSICA */
    #musicBtn{
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10000;
      margin: 0;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
    }

    /* CORAÇÕES */
    .heart {
      position: fixed;
      bottom: -20px;
      animation: floatUp 6s linear forwards;
      opacity: .7;
      z-index: 1;
      pointer-events: none;
    }
    @keyframes floatUp { to { transform: translateY(-110vh); opacity: 0; } }

    /* ===== EFEITO FINAL ===== */
    #efeito-final {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8a2be2);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 18px;
    }
    .final-box { text-align: center; animation: fadeUp 1.2s ease; }

    /* POLAROIDS */
    .polaroids {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .polaroid {
      background: white;
      padding: 10px 10px 20px;
      width: 110px;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,.4);
      opacity: 0;
      transform: translateY(30px);
      animation: aparecer 0.8s forwards;
    }
    .polaroid img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 4px;
    }
    .polaroid span {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: #333;
      font-family: 'Courier New', monospace;
    }
    @keyframes aparecer { to { opacity: 1; transform: translateY(0); } }

    .contador-final {
      background: rgba(255,255,255,0.25);
      padding: 14px 20px;
      border-radius: 18px;
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.3;
    }

    .texto-final {
      font-size: 16px;
      font-weight: bold;
      min-height: 70px;
      padding: 0 6px;
      white-space: normal;
    }

    /* BOTÕES FINAL */
    .final-actions{
      display:flex;
      justify-content:center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .ver-de-novo {
      background: rgba(255,255,255,0.9);
      color: #ff4d6d;
    }

    .secondary {
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.22);
    }

    /* LIGHTBOX */
    #lightbox{
      display:none;
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.78);
      z-index: 20000;
      justify-content:center;
      align-items:center;
      padding: 18px;
    }
    #lightboxImg{
      max-width: 92vw;
      max-height: 86vh;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }
    #lightboxHint{
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      opacity: .85;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 8px 12px;
      border-radius: 999px;
    }

    /* Ajustes mobile */
    @media (max-width: 360px){
      h1{ font-size: 22px; }
      .subtitle{ font-size: 12px; }
      .polaroid{ width: 100px; }
    }
  </style>
</head>

<body>
  <!-- BOTÃO + ÁUDIO (troque o arquivo por um seu: /music/musica.mp3) -->
  <button id="musicBtn" type="button" aria-label="Tocar ou pausar música">▶️ Tocar música</button>
  <audio id="bgMusic" loop preload="none">
    <source src="music/musica.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="card">
    <h1>Beatriz ❤️ Gustavo</h1>
    <div class="subtitle">Desde 01 de janeiro de 2024</div>

    <div class="timer" id="timer"></div>

    <!-- TIMELINE (edite as datas e textos como quiser) -->
    <div class="timeline">
      <div class="tl-item"><b>✨ 01/01/2024</b><span>Nosso começo</span></div>
      <div class="tl-item"><b>📸 18/08/2024</b><span>Um dia que ficou pra sempre</span></div>
      <div class="tl-item"><b>❤️ 31/12/2024</b><span>Virada juntinhos</span></div>
    </div>

    <div class="gallery">
      <img src="images/IMG-20240818-WA0020~2.jpg" alt="Foto 1">
      <img src="images/IMG-20250330-WA0054.jpg" alt="Foto 2">
      <img src="images/IMG_20240721_120318_384.webp" alt="Foto 3">
      <img src="images/IMG_20241205_220620_726.webp" alt="Foto 4">
      <img src="images/IMG_20241231_231718_292.webp" alt="Foto 5">
      <img src="images/IMG_20251111_145539_183.webp" alt="Foto 6">
    </div>

    <button type="button" onclick="mostrarFinal()">Clique para uma surpresa 💌</button>
  </div>

  <div id="efeito-final">
    <div class="final-box">
      <div class="polaroids">
        <div class="polaroid" style="animation-delay:0.3s">
          <img src="images/IMG-20240818-WA0020~2.jpg" alt="Polaroid 1">
          <span>Nosso começo 🤍</span>
        </div>
        <div class="polaroid" style="animation-delay:0.8s">
          <img src="images/IMG_20241231_231718_292.webp" alt="Polaroid 2">
          <span>Só nós ✨</span>
        </div>
        <div class="polaroid" style="animation-delay:1.3s">
          <img src="images/IMG_20251116_155233_488.webp" alt="Polaroid 3">
          <span>Pra sempre 💖</span>
        </div>
      </div>

      <div class="contador-final" id="contador-final"></div>

      <div class="texto-final" id="texto-digitado"></div>

      <div class="final-actions">
        <button type="button" class="secondary" onclick="novaFrase()">💬 Outra mensagem</button>
        <button type="button" class="ver-de-novo" onclick="verDeNovo()">🔁 Ver de novo</button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" aria-label="Visualização de foto em tela cheia">
    <img id="lightboxImg" alt="Foto em tela cheia" />
    <div id="lightboxHint">Clique fora da foto ou aperte ESC para fechar</div>
  </div>

  <script>
    // ===== CONFIGURAÇÃO =====
    const startDate = new Date(2024, 0, 1, 0, 0, 0); // 01/01/2024 00:00:00 (mês 0 = janeiro)

    // Frases aleatórias (edite/adicione à vontade)
    const frases = [
      "Você é meu lugar favorito. 💖",
      "Te escolheria em todas as vidas. ✨",
      "Meu amor por você só cresce. 🌙",
      "Obrigado por existir do meu lado. 🤍",
      "Com você, tudo faz sentido. 💕",
      "Se eu tivesse que recomeçar, eu te escolheria de novo. ❤️"
    ];

    // Texto digitado inicial
    const textoDigitadoInicial =
      "Nunca se esqueça:\nVocê é a minha melhor escolha. E mesmo que não fosse, eu te escolheria um milhão de vezes. 💕";

    // ===== TIMER (anos/meses/dias REAIS, sem aproximação) =====
    function daysInMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    function diffCalendar(from, to) {
      // garante ordem
      let start = new Date(from);
      let end = new Date(to);
      if (end < start) [start, end] = [end, start];

      // componentes
      let years = end.getFullYear() - start.getFullYear();
      let months = end.getMonth() - start.getMonth();
      let days = end.getDate() - start.getDate();

      // ajusta dias negativos emprestando um mês
      if (days < 0) {
        months -= 1;
        const prevMonth = (end.getMonth() - 1 + 12) % 12;
        const prevMonthYear = prevMonth === 11 ? end.getFullYear() - 1 : end.getFullYear();
        days += daysInMonth(prevMonthYear, prevMonth);
      }

      // ajusta meses negativos emprestando um ano
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      // diferença total para horas/min/seg
      const totalMs = end - start;
      const totalSeconds = Math.floor(totalMs / 1000);
      const seconds = totalSeconds % 60;
      const totalMinutes = Math.floor(totalSeconds / 60);
      const minutes = totalMinutes % 60;
      const totalHours = Math.floor(totalMinutes / 60);
      const hours = totalHours % 24;

      return { years, months, days, hours, minutes, seconds };
    }

    function atualizarTempo() {
      const now = new Date();
      const { years, months, days, hours, minutes, seconds } = diffCalendar(startDate, now);

      document.getElementById("timer").innerHTML = `
        <div class="time-box"><div class="number">${years}</div><div class="label">Anos</div></div>
        <div class="time-box"><div class="number">${months}</div><div class="label">Meses</div></div>
        <div class="time-box"><div class="number">${days}</div><div class="label">Dias</div></div>
        <div class="time-box"><div class="number">${hours}</div><div class="label">Horas</div></div>
        <div class="time-box"><div class="number">${minutes}</div><div class="label">Min</div></div>
        <div class="time-box"><div class="number">${seconds}</div><div class="label">Seg</div></div>
      `;

      document.getElementById("contador-final").innerHTML =
        `${years} anos • ${months} meses • ${days} dias<br>${hours}h ${minutes}m ${seconds}s juntos ❤️`;
    }

    setInterval(atualizarTempo, 1000);
    atualizarTempo();

    // ===== FINAL (transição + texto digitando) =====
    function mostrarFinal() {
      const card = document.getElementById("card");
      card.classList.add("fade-out");

      setTimeout(() => {
        card.style.display = "none";
        document.getElementById("efeito-final").style.display = "flex";
        digitarTexto(textoDigitadoInicial);
      }, 900);
    }

    function verDeNovo() {
      document.getElementById("efeito-final").style.display = "none";
      const card = document.getElementById("card");
      card.style.display = "block";
      card.classList.remove("fade-out");
    }

    let typingInterval = null;

    function digitarTexto(texto) {
      const el = document.getElementById("texto-digitado");
      el.innerHTML = "";
      let i = 0;

      if (typingInterval) clearInterval(typingInterval);

      typingInterval = setInterval(() => {
        const ch = texto[i];
        el.innerHTML += ch === "\n" ? "<br>" : ch;
        i++;
        if (i >= texto.length) clearInterval(typingInterval);
      }, 40);
    }

    function novaFrase() {
      const frase = frases[Math.floor(Math.random() * frases.length)];
      // troca instantânea (sem digitar) pra ficar responsivo
      const el = document.getElementById("texto-digitado");
      el.innerHTML = frase;
      if (typingInterval) clearInterval(typingInterval);
    }

    // ===== LIGHTBOX (clicar na galeria abre tela cheia) =====
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    document.querySelectorAll(".gallery img").forEach(img => {
      img.addEventListener("click", () => {
        lightboxImg.src = img.src;
        lightbox.style.display = "flex";
      });
    });

    function fecharLightbox() { lightbox.style.display = "none"; }

    lightbox.addEventListener("click", (e) => {
      // fecha ao clicar fora da imagem
      if (e.target === lightbox) fecharLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") fecharLightbox();
    });

    // ===== MÚSICA (play/pausa + estado salvo) =====
    const bgMusic = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicBtn");

    function updateMusicBtn() {
      const playing = !bgMusic.paused;
      musicBtn.textContent = playing ? "⏸️ Pausar música" : "▶️ Tocar música";
    }

    musicBtn.addEventListener("click", async () => {
      try {
        if (bgMusic.paused) {
          await bgMusic.play();
          localStorage.setItem("music", "on");
        } else {
          bgMusic.pause();
          localStorage.setItem("music", "off");
        }
        updateMusicBtn();
      } catch (e) {
        alert("O navegador bloqueou o autoplay. Clique novamente 😊");
      }
    });

    // apenas atualiza o botão no carregamento
    updateMusicBtn();

    // ===== CORAÇÕES =====
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 20) + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }, 700);
  </script>
</body>
</html>
